[package]
name = "video-encoder"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Video encoding pipeline for AWS Batch with multi-codec support"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AWS SDK
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"

# CLI & Error handling
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async recursion
async-recursion = "1"

# Encryption support
base64 = "0.22"

# DateTime
chrono = "0.4"

# FFmpeg wrapper (optional, can also use process spawning)
# ffmpeg-next = "7"  # Uncomment if linking FFmpeg directly

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "config_benchmarks"
harness = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
