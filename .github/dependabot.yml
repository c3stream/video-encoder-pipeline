version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/encoder"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "rust"
    groups:
      aws-sdk:
        patterns:
          - "aws-*"
      tokio:
        patterns:
          - "tokio*"
      serde:
        patterns:
          - "serde*"
      tracing:
        patterns:
          - "tracing*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # Note: CDK Go modules are managed in a separate infrastructure repository
  # If you need CDK dependency updates, add them back with:
  # - package-ecosystem: "gomod"
  #   directory: "/cdk"
  #   ...
