version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns:
          - "aws-*"
      tokio:
        patterns:
          - "tokio*"
      serde:
        patterns:
          - "serde*"
    reviewers:
      - "kazuhirokondo"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Go modules (CDK)
  - package-ecosystem: "gomod"
    directory: "/cdk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
